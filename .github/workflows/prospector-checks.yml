name: Prospector checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure isolated browser fixtures
        run: |
          echo 'VITE_SUPABASE_URL=https://prospector-ci.invalid' > .env
          echo 'VITE_SUPABASE_ANON_KEY=fixture-anon-key' >> .env
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npx --yes deno@2 check --no-lock --config supabase/functions/prospector-worker/deno.json supabase/functions/prospector-worker/index.ts supabase/functions/contact-submit/index.ts supabase/functions/automation-outlook/index.ts supabase/functions/automation-worker/index.ts supabase/functions/prospector-send-email/index.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
